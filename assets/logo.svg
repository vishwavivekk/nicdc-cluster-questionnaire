<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" preserveAspectRatio="xMinYMid meet" role="img" aria-label="NICDC - National Industrial Corridor Development Corporation">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#13315C"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E87722"/>
      <stop offset="1" stop-color="#F4A024"/>
    </linearGradient>
  </defs>
  <!-- Emblem: corridor / industrial chevron -->
  <g transform="translate(8,12)">
    <rect x="0" y="0" width="86" height="86" rx="14" fill="url(#g1)"/>
    <!-- three industrial stacks -->
    <g fill="#F4A024">
      <rect x="18" y="48" width="10" height="26" rx="1.5"/>
      <rect x="34" y="38" width="10" height="36" rx="1.5"/>
      <rect x="50" y="28" width="10" height="46" rx="1.5"/>
    </g>
    <!-- chevron / corridor lines -->
    <path d="M14 22 L43 12 L72 22" stroke="#E87722" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="68" cy="64" r="4" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(110,0)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <text x="0" y="38" font-size="30" font-weight="800" fill="#0B2545" letter-spacing="2">NICDC</text>
    <text x="0" y="60" font-size="11" font-weight="700" fill="#13315C" letter-spacing="1.2">NATIONAL INDUSTRIAL CORRIDOR</text>
    <text x="0" y="74" font-size="11" font-weight="700" fill="#13315C" letter-spacing="1.2">DEVELOPMENT CORPORATION</text>
    <rect x="0" y="82" width="58" height="3" fill="url(#g2)"/>
    <text x="64" y="86" font-size="10" font-style="italic" font-weight="600" fill="#E87722" letter-spacing="0.8">India Reimagined</text>
  </g>
</svg>
